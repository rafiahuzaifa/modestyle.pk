version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: modeststyle-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - apps/frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modeststyle-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: modeststyle-backend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=sqlite:///./sqlite.db
    env_file:
      - apps/backend/.env.example
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - modeststyle-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  backend-data:
    driver: local

networks:
  modeststyle-network:
    driver: bridge
